<!doctype html>
<html lang="zh-TW" data-layout="onepage">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__TITLE__</title>
    <!-- 空 favicon：不加的話瀏覽器每次開頁都去要 /favicon.ico、主控台留一筆 404 -->
    <link rel="icon" href="data:," />
    <style>
      /* ── 頁內歸零（2026-11 拿掉 Tailwind CDN 後補上：原本靠它的 preflight 歸零，外觀照舊）── */
      *,
      ::before,
      ::after {
        box-sizing: border-box;
        border-width: 0;
        border-style: solid;
      }
      h1, h2, h3, h4, h5, h6 {
        font-size: inherit;
        font-weight: inherit;
      }
      h1, h2, h3, h4, h5, h6, p, blockquote, figure, dl, dd, pre, hr {
        margin: 0;
      }
      ol, ul, menu {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      a {
        color: inherit;
        text-decoration: inherit;
      }
      b, strong {
        font-weight: bolder;
      }
      small {
        font-size: 80%;
      }
      table {
        border-collapse: collapse;
        border-color: inherit;
        text-indent: 0;
      }
      button, input, select, textarea {
        font: inherit;
        letter-spacing: inherit;
        color: inherit;
        margin: 0;
        padding: 0;
      }
      button {
        background-color: transparent;
        background-image: none;
        cursor: pointer;
      }
      img, svg, video, canvas {
        display: block;
        vertical-align: middle;
      }
      img, video {
        max-width: 100%;
        height: auto;
      }
      [hidden] {
        display: none;
      }
      /* ════════════════════════════════════════════ */
      /* 一頁版（onepage）— 1920×1080 一個畫面放完：      */
      /* 標題 → 一張主圖 → ≤3 條重點。不捲動。           */
      /* 規則見 references/onepage.md；token 同 base-template */
      /* ════════════════════════════════════════════ */
      :root {
        --wrap-max: 1840px; /* 內容寬度：設定檔 tokens.layout.maxWidth 與「風格設定」改的就是它 */
        --ivory: #faf9f5;
        --paper: #ffffff;
        --slate: #141413;
        --clay: #d97757;
        --clay-d: #b85c3e;
        --oat: #e3dacc;
        --olive: #788c5d;
        --g100: #f0eee6;
        --g200: #e6e3da;
        --g300: #d1cfc5;
        --g500: #87867f;
        --g700: #3d3d3a;

        --serif: ui-serif, Georgia, "Times New Roman", Times, serif;
        --sans:
          system-ui, -apple-system, "Segoe UI", Roboto, "PingFang TC",
          "Noto Sans TC", Helvetica, Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;

        --accent-soft: #fbe9df;

        /* ── 墨色：24px 以下的字只用這組（同 base-template）──────────
           每個在 ivory／paper 上都 ≥ 4.5:1。--clay／--g500 只當填色、邊框與
           24px 以上的展示字（它們當小字只有 2.9–3.5:1） */
        --text-soft: #6c6b65;
        --clay-ink: #a64b2e;
        --green-ink: #566b40;
        --yellow-ink: #7d6019;
        --red: var(--clay-ink);
        --yellow-soft: #f8efd9;
        --bg: var(--ivory);
        --text: var(--slate);
        --accent: var(--clay);

        /* 場景動畫（影片模式）一個時鐘：見 references/video-explainer.md */
        --scene-step: 520ms;
        --scene-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--ivory);
        color: var(--slate);
        font-family: var(--sans);
        font-size: 18px;
        line-height: 1.5; /* 舊版寫 1.55，但 Tailwind 的歸零蓋掉它、實際一直是 1.5；拿掉 Tailwind 後照實際值寫 */
        -webkit-font-smoothing: antialiased;
        font-synthesis: none; /* 擋掉中文合成斜體／粗體，理由見 base-template */
      }
      p,
      li {
        text-wrap: pretty;
      }
      /* 中文標題：只在標點、空白與 .ph 片段之間換行，不把詞切開；整串沒斷點才硬斷（同 base-template）。
         長標題把語意片段包成 <span class="ph">…</span> */
      h1,
      h2,
      h3 {
        text-wrap: balance;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      .ph {
        display: inline-block;
      }

      /* ── 骨架：三列（標題／主體／頁尾），至少一個視窗高 ──
         用 min-height 不用 height：內容真的放不下時頁面會變長、
         一頁檢查（onepage-check）量得到，而不是互相蓋住看不出來。 */
      .op {
        width: min(96vw, var(--wrap-max, 1840px));
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 28px;
        padding: 44px 0 28px;
      }

      /* ── 標題區 ── */
      .op-head .eyebrow {
        font-family: var(--mono);
        font-size: 14px;
        letter-spacing: 0.1em;
        color: var(--text-soft);
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .op-head .eyebrow::before {
        content: "";
        width: 28px;
        height: 2px;
        background: var(--clay);
      }
      body .op-head h1 {
        font-family: var(--serif);
        font-weight: 500;
        font-size: clamp(34px, 3.2vw, 60px);
        line-height: 1.08;
        letter-spacing: -0.015em;
        margin: 0;
        color: var(--slate);
      }
      h1 em {
        font-style: normal;
        font-weight: 700;
        color: var(--clay-d); /* --clay 在米白底只有 2.96:1，大字也不到 3:1（同 base-template 改用 clay-d） */
      }
      .op-head .op-sub {
        font-size: clamp(17px, 1.25vw, 23px);
        color: var(--g700);
        margin: 12px 0 0;
        max-width: 72ch;
      }

      /* ── 主體：左主圖、右重點 ── */
      .op-main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(340px, 30%);
        gap: 36px;
        min-height: 0;
      }
      .op-main > * {
        min-width: 0;
      }
      .op-fig {
        position: relative;
        min-height: 420px;
        margin: 0;
      }
      /* 主圖填滿格子：絕對定位讓 SVG 不撐高頁面，等比縮放 */
      .op-fig .figure {
        position: absolute;
        inset: 0;
        background: var(--paper);
        border: 1.5px solid var(--g300);
        border-radius: 14px;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .op-fig svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* 一頁版的圖要在投影／影片上讀得到：字比一般頁大一階（viewBox 單位） */
      .op-fig svg text {
        font-family: var(--sans);
        font-size: 17px;
        fill: var(--g700);
      }
      .op-fig svg text.n {
        font-size: 21px;
        font-weight: 600;
        fill: var(--slate);
      }
      .op-fig svg text.accent {
        fill: var(--clay-d);
      }

      .op-take-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin: 0;
        padding: 0;
        list-style: none;
        counter-reset: tk;
      }
      .op-side {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .op-side h2 {
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--text-soft);
        margin: 0 0 2px;
      }
      .op-take {
        counter-increment: tk;
        background: var(--paper);
        border: 1.5px solid var(--g300);
        border-left: 4px solid var(--clay);
        border-radius: 12px;
        padding: 18px 22px 18px 64px;
        position: relative;
      }
      .op-take::before {
        content: counter(tk);
        position: absolute;
        left: 20px;
        top: 16px;
        font-family: var(--serif);
        font-size: 30px;
        line-height: 1;
        color: var(--clay);
      }
      .op-take strong {
        display: block;
        font-size: clamp(18px, 1.3vw, 24px);
        line-height: 1.35;
        font-weight: 650;
        color: var(--slate);
      }
      .op-take span {
        display: block;
        margin-top: 6px;
        font-size: clamp(15px, 0.95vw, 18px);
        color: var(--g700);
      }

      /* ── 頁尾：一行出處 ── */
      .op-foot {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-family: var(--mono);
        font-size: 13px;
        color: var(--text-soft);
        border-top: 1.5px solid var(--g300);
        padding-top: 12px;
      }

      /* ── 窄螢幕／矮螢幕：退回一般捲動頁（一頁限制只針對 ≥1100px 的桌機／影片）── */
      @media (max-width: 1100px) {
        .op {
          min-height: 0;
          width: 100%;
          padding: 28px 16px 40px;
        }
        .op-main {
          grid-template-columns: minmax(0, 1fr);
        }
        .op-fig {
          min-height: 0;
        }
        .op-fig .figure {
          position: static;
          overflow-x: auto;
          padding: 12px;
        }
        .op-fig svg {
          height: auto;
        }
        .op-foot {
          flex-direction: column;
        }
      }

      /* ════════════════════════════════════════════ */
      /* 場景（影片模式）— 平常全部顯示（靜態幀資訊完整）；  */
      /* 呼叫 __goToScene(n) 或網址帶 ?scene=n 才逐幕出現。  */
      /* ════════════════════════════════════════════ */
      .scene-mode [data-scene] {
        opacity: 0;
        transition: opacity var(--scene-step) var(--scene-ease),
          transform var(--scene-step) var(--scene-ease);
      }
      /* HTML 元素多一點位移；SVG 只淡入（CSS transform 會蓋掉 SVG 的 transform 屬性） */
      .scene-mode [data-scene]:not(svg *) {
        transform: translateY(14px);
      }
      .scene-mode [data-scene].scene-on {
        opacity: 1;
        transform: none;
      }
      /* 畫線：路徑加 pathLength="1" class="draw"，進場時從頭畫到尾 */
      .scene-mode [data-scene] .draw {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        transition: stroke-dashoffset calc(var(--scene-step) * 1.8) var(--scene-ease) 120ms;
      }
      .scene-mode [data-scene].scene-on .draw {
        stroke-dashoffset: 0;
      }
      /* 當前這一幕的節點框加重，讓視線跟著旁白走 */
      .scene-mode [data-scene].scene-now .box {
        stroke: var(--clay);
        stroke-width: 2.5;
      }
      /* 影片模式藏掉介面元件（評論、session 徽章、風格設定） */
      .video-mode .vt-comment-trigger,
      .video-mode .vt-comment-pill,
      .video-mode .vt-comment-popup,
      .video-mode .vt-comment-list,
      .video-mode .vt-session-badge,
      .video-mode .vt-tw-root {
        display: none !important;
      }
      /* 列印／存 PDF：介面元件不印；場景模式下還沒出現的幕一律現形（淡入沒跑完也看得到） */
      @media print {
        .vt-comment-trigger,
        .vt-comment-pill,
        .vt-comment-popup,
        .vt-comment-list,
        .vt-session-badge,
        .vt-tw-root {
          display: none !important;
        }
        .scene-mode [data-scene] {
          opacity: 1 !important;
          transform: none !important;
        }
        .scene-mode [data-scene] .draw {
          stroke-dashoffset: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="op">
      <!-- ── 標題：一行主標 ＋ 一句副標（≤ 40 字，照 references/writing-ste.md） ── -->
      <header class="op-head">
        <div class="eyebrow">__SUBTITLE__ · __DATE__</div>
        <h1><span class="ph">__TITLE__：</span><span class="ph">一句話講完<em>主旨</em></span></h1>
        <p class="op-sub">副標一句：讀者看完這頁會知道什麼。</p>
      </header>

      <main class="op-main">
        <!-- ── 一張主圖：SVG 結構圖，畫法見 references/structure-diagrams.md ──
             data-scene="N"：影片第 N 幕才出現（放在沒有 transform 屬性的外層 <g>） -->
        <section id="diagram" class="op-fig">
          <div class="figure">
            <svg
              viewBox="0 0 1000 560"
              preserveAspectRatio="xMidYMid meet"
              role="img"
              aria-labelledby="op-title op-desc"
            >
              <title id="op-title">主圖標題</title>
              <desc id="op-desc">三個步驟由左到右：輸入、處理、輸出。</desc>
              <!-- 顏色寫成 style＋變數（不用 fill="#…" 屬性）：換主題（例如 mrl）時圖才會跟著換色 -->
              <defs>
                <marker id="op-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                  <polygon points="0 0, 10 4, 0 8" style="fill: var(--g500)" />
                </marker>
                <marker id="op-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                  <polygon points="0 0, 10 4, 0 8" style="fill: var(--clay-d)" />
                </marker>
              </defs>
              <rect width="100%" height="100%" style="fill: var(--paper)" />

              <!-- 第 2 幕：第一條線 -->
              <g data-scene="2">
                <g class="edge" data-from="in" data-to="proc" data-label="交給">
                  <path class="ln draw" pathLength="1" d="M 280,280 H 386" fill="none" style="stroke: var(--g500)" stroke-width="2" marker-end="url(#op-arrow)" />
                </g>
              </g>
              <!-- 第 3 幕：第二條線（主線，accent） -->
              <g data-scene="3">
                <g class="edge" data-from="proc" data-to="out" data-label="產出">
                  <path class="ln draw" pathLength="1" d="M 614,280 H 720" fill="none" style="stroke: var(--clay-d)" stroke-width="2.4" marker-end="url(#op-arrow-accent)" />
                </g>
              </g>

              <!-- 第 1 幕：輸入 -->
              <g data-scene="1">
                <g class="node" data-id="in" data-kind="ours" data-title="輸入" transform="translate(60,220)">
                  <rect class="box" width="220" height="120" rx="8" style="fill: var(--paper); stroke: var(--g500)" stroke-width="1.5" />
                  <text x="110" y="52" class="n" text-anchor="middle">輸入</text>
                  <text x="110" y="84" text-anchor="middle">一句補充</text>
                </g>
              </g>
              <!-- 第 2 幕：處理 -->
              <g data-scene="2">
                <g class="node" data-id="proc" data-kind="ours" data-title="處理" transform="translate(390,220)">
                  <rect class="box" width="220" height="120" rx="8" style="fill: var(--paper); stroke: var(--g500)" stroke-width="1.5" />
                  <text x="110" y="52" class="n" text-anchor="middle">處理</text>
                  <text x="110" y="84" text-anchor="middle">一句補充</text>
                </g>
              </g>
              <!-- 第 3 幕：輸出（強調 ≤ 2 處） -->
              <g data-scene="3">
                <g class="node" data-id="out" data-kind="ours" data-title="輸出" transform="translate(724,220)">
                  <rect class="box" width="220" height="120" rx="8" style="fill: var(--accent-soft); stroke: var(--clay)" stroke-width="1.5" />
                  <text x="110" y="52" class="n" text-anchor="middle">輸出</text>
                  <text x="110" y="84" class="accent" text-anchor="middle">一句補充</text>
                </g>
              </g>
            </svg>
          </div>
        </section>

        <!-- ── 重點：最多 3 條，每條一句結論（≤ 25 字）＋一句補充 ── -->
        <section id="takeaways" class="op-side">
          <h2>三個重點</h2>
          <ol class="op-take-list">
            <li class="op-take" data-takeaway data-scene="1">
              <strong>重點一：用結論開頭的一句話。</strong>
              <span>補充一句：數字或例子。</span>
            </li>
            <li class="op-take" data-takeaway data-scene="2">
              <strong>重點二：一句只講一件事。</strong>
              <span>補充一句：數字或例子。</span>
            </li>
            <li class="op-take" data-takeaway data-scene="3">
              <strong>重點三：讀者下一步要做什麼。</strong>
              <span>補充一句：數字或例子。</span>
            </li>
          </ol>
        </section>
      </main>

      <footer class="op-foot">
        <span>出處／資料時間：__SOURCE__</span>
        <span>__DATE__</span>
        <!-- 品牌插槽：蓋章時 mrl 主題填居家先生字標，原生樣式留空 -->
        <!-- vt-brand:mark --><!-- /vt-brand:mark -->
      </footer>
    </div>

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- 影片旁白：每幕一段（≤ 15 秒、≤ 3 句），只做一頁版可整段刪除 -->
    <!-- render-video.mjs 讀這段產生配音與字幕                     -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <script type="application/json" id="video-scenes">
      {
        "scenes": [
          { "scene": 1, "narration": "第一幕旁白。先講輸入是什麼。" },
          { "scene": 2, "narration": "第二幕旁白。再講它怎麼被處理。" },
          { "scene": 3, "narration": "第三幕旁白。最後講產出與下一步。" }
        ]
      }
    </script>

    <!-- 場景引擎：平常不做任何事；__goToScene(n) 或 ?scene=n 才進場景模式 -->
    <script>
      (function () {
        var root = document.documentElement;
        function items() {
          return Array.prototype.slice.call(document.querySelectorAll("[data-scene]"));
        }
        function readScenes() {
          var el = document.getElementById("video-scenes");
          if (!el) return [];
          try {
            return JSON.parse(el.textContent).scenes || [];
          } catch (e) {
            return [];
          }
        }
        function count() {
          var n = readScenes().length;
          items().forEach(function (el) {
            n = Math.max(n, parseInt(el.getAttribute("data-scene"), 10) || 0);
          });
          return n;
        }
        // 旁白來源：JSON 區塊優先；沒有就收集各幕元素上的 data-narration
        window.__getScenes = function () {
          var json = readScenes();
          if (json.length) return json;
          var out = [];
          for (var i = 1; i <= count(); i++) {
            var t = items()
              .filter(function (el) {
                return parseInt(el.getAttribute("data-scene"), 10) === i && el.getAttribute("data-narration");
              })
              .map(function (el) {
                return el.getAttribute("data-narration");
              })
              .join("");
            out.push({ scene: i, narration: t });
          }
          return out;
        };
        window.__sceneCount = count;
        // 決定性：同一個 n 永遠得到同一個畫面（只切 class，動畫交給 CSS）
        window.__goToScene = function (n) {
          n = parseInt(n, 10) || 0;
          root.classList.add("scene-mode");
          root.setAttribute("data-scene-now", String(n));
          items().forEach(function (el) {
            var s = parseInt(el.getAttribute("data-scene"), 10) || 0;
            el.classList.toggle("scene-on", s <= n);
            el.classList.toggle("scene-now", s === n);
          });
          return n;
        };
        var q = new URLSearchParams(location.search);
        if (q.has("video")) root.classList.add("video-mode");
        if (q.has("scene")) window.__goToScene(q.get("scene"));
        // 場景模式下可用方向鍵手動預覽
        document.addEventListener("keydown", function (e) {
          if (!root.classList.contains("scene-mode")) return;
          var now = parseInt(root.getAttribute("data-scene-now"), 10) || 0;
          if (e.key === "ArrowRight") window.__goToScene(Math.min(count(), now + 1));
          if (e.key === "ArrowLeft") window.__goToScene(Math.max(0, now - 1));
        });
      })();
    </script>

    <!-- vt-comment:start（全頁評論系統整段，範例頁用腳本從這行替換到 vt-comment:end）-->
    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- 全頁評論系統 — 預設內建、可手動移除                       -->
    <!-- 完整 snippet 見 references/interaction-patterns.md       -->
    <!-- § 全頁評論系統（page-wide commenting，預設內建）         -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <style>
      .vt-comment-trigger {
        position: fixed;
        z-index: 9998;
        background: var(--paper);
        border: 1.5px solid var(--clay);
        border-radius: 999px;

    <script>
      // 三段式：clipboard API → execCommand 備援 → 都失敗回 false（不假報成功）
      window.vtCopyText = async function (text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (err) {
            // 落到 execCommand 備援
          }
        }
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "-9999px";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        try {
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          return document.execCommand("copy") === true;
        } catch (err) {
          return false;
        } finally {
          ta.remove();

      window.vtSelectForManualCopy = function (text, target, wrap) {
        let node = target;
        if (node) {
          node.textContent = text;
          if (wrap) wrap.classList.remove("hidden");

          node = document.getElementById("vt-manual-copy-box");
          if (!node) {
            node = document.createElement("pre");
            node.id = "vt-manual-copy-box";
            node.title = "雙擊關閉";

              "padding:14px 16px;font-size:12.5px;line-height:1.6;" +
              "box-shadow:0 12px 40px rgba(0,0,0,.28)";
            node.addEventListener("dblclick", function () {

          sel.addRange(range);

          }
          const re2 = new RegExp(
            w.map((s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("\\s*"),
          );
          const m2 = re2.exec(txt);
          if (!m2) return;
          const st = m2.index,
            en = st + m2[0].length;
          all
            .filter(([n, o]) => o < en && o + n.nodeValue.length > st)
            .forEach(([n, o]) => wp(n, Math.max(0, st - o), Math.min(n.nodeValue.length, en - o), x.id));
        }
        function rn() {
          ce.textContent = c.length;
          pi.classList.toggle("is-active", c.length > 0);
          if (!c.length) le.classList.remove("is-open");
          li.innerHTML = c
            .map((x) => {
              const q =
                x.quote.length > 60 ? x.quote.slice(0, 60) + "…" : x.quote;
              const quote = mk(x.id)
                ? `<button type="button" class="item-quote" data-jump="${eh(x.id)}" title="捲到這段">「${eh(q)}」</button>`
                : `<div class="item-quote">「${eh(q)}」${x.nomark ? "" : '<span class="item-lost">原文已變動</span>'}</div>`;
              return `<div class="vt-comment-item" data-id="${eh(x.id)}">${quote}<div class="item-body">${eh(x.body)}</div><button class="item-del" data-del="${eh(x.id)}">刪除</button></div>`;
            })
            .join("");
          li.querySelectorAll("[data-del]").forEach((b) =>
            b.addEventListener("click", () => dc(b.dataset.del)),
          );
          li.querySelectorAll("[data-jump]").forEach((b) =>
            b.addEventListener("click", () => jp(b.dataset.jump)),
          );
        }
        // 清單點引文：捲到那段、短暫高亮；手機上清單會蓋住內文，捲過去時順手收起
        function jp(id) {
          const m = mk(id);
          if (!m) return;
          m.scrollIntoView({ block: "center" });
          const ms = document.querySelectorAll(`mark.vt-comment-mark[data-comment-id="${id}"]`);
          ms.forEach((e) => e.classList.add("is-flash"));
          setTimeout(() => ms.forEach((e) => e.classList.remove("is-flash")), 1600);
          if (innerWidth <= 640) le.classList.remove("is-open");
        }
        function dc(id) {
          c = c.filter((x) => x.id !== id);
          document
            .querySelectorAll(`mark.vt-comment-mark[data-comment-id="${id}"]`)
            .forEach((m) => {
              const pr = m.parentNode;
              while (m.firstChild) pr.insertBefore(m.firstChild, m);
              pr.removeChild(m);
              pr.normalize();
            });
          ps();
          rn();
        }
        function eh(s) {
          return String(s).replace(
            /[&<>"']/g,
            (ch) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[ch],
          );
        }
        pi.addEventListener("click", () => le.classList.toggle("is-open"));
        // 清單關閉：右上關閉鈕、Esc
        $("vt-list-close").addEventListener("click", () => le.classList.remove("is-open"));
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") le.classList.remove("is-open");
        });
        // 有回傳列時，清單底緣跟著列高（列在手機與拍板頁會變高），不要壓到列
        const bar = document.querySelector(".sticky-bar");
        if (bar) new ResizeObserver(() => (le.style.bottom = bar.getBoundingClientRect().height + 12 + "px")).observe(bar);
        $("vt-clear-all").addEventListener("click", () => {
          if (!c.length) return;
          if (!confirm("確定清除全部 " + c.length + " 則留言？")) return;
          document.querySelectorAll("mark.vt-comment-mark").forEach((m) => {
            const pr = m.parentNode;
            while (m.firstChild) pr.insertBefore(m.firstChild, m);
            pr.removeChild(m);
            pr.normalize();
          });
          c = [];
          ps();
          rn();
        });
        $("vt-copy-fallback").addEventListener("click", async (e) => {
          if (!c.length) return;
          const t = window.vtCollectComments().replace(/^\n\n---\n\n/, ""),
            b = e.currentTarget,
            o = b.innerHTML; // innerHTML：按鈕裡有 SVG 圖示，用 textContent 還原會把圖示弄丟
          const ok = await window.vtCopyText(t);
          if (ok) {
            b.textContent = "已複製";
          } else {
            // 複製不到就不假報成功：把評論放進臨時區域並全選
            window.vtSelectForManualCopy(t);
            b.textContent = "已選取 → 請按 Cmd+C";
          }
          setTimeout(() => (b.innerHTML = o), ok ? 2000 : 6000);
        });
        setTimeout(() => {
          if (typeof window.vtBuildDecisionExport === "function")
            document.body.classList.add("vt-has-existing-export");
        }, 100);
        document.addEventListener("click", (e) => {
          if (
            p.style.display === "block" &&
            !e.target.closest(".vt-comment-popup,.vt-comment-trigger")
          )
            cp();
        });
        c.forEach(ra);
        rn();
      })();
    </script>
    <!-- vt-comment:end -->

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- Session 識別 — 多視窗並行時分辨這份是哪個 session 產的     -->
    <!-- 產出時把 scripts/session-label.sh 的結果填進下面兩個值      -->
    <!-- 留空 = 整段停用（範本原檔即此狀態）                        -->
    <!-- 完整說明見 references/session-identity.md                 -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <script>
      window.VT_SESSION = { label: "", id: "", project: "" };
    </script>
    <style>
      .vt-session-badge {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 5px 16px;
        background: var(--vt-session-color, #666);
        color: #fff;
        font-family: var(--mono, ui-monospace, monospace);
        font-size: 11.5px;
        letter-spacing: 0.06em;
      }
      .vt-session-badge .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.85;
        flex-shrink: 0;
      }
      .vt-session-badge .lb {
        font-weight: 700;
        text-transform: uppercase;
      }
      .vt-session-badge .id {
        margin-left: auto;
        opacity: 0.75;
      }
    </style>
    <script>
      (function () {
        const s = window.VT_SESSION || {};
        if (!s.label) return;
        const seed = s.id || s.label;
        let hue = 7;
        for (const c of seed) hue = (hue * 31 + c.charCodeAt(0)) % 360;
        const col = `hsl(${hue} 58% 42%)`;
        document.title = `${s.label} · ${document.title}`;
        try {
          const cv = document.createElement("canvas");
          cv.width = cv.height = 64;
          const g = cv.getContext("2d");
          g.fillStyle = col;
          if (g.roundRect) {
            g.beginPath();
            g.roundRect(2, 2, 60, 60, 14);
            g.fill();
          } else {
            g.fillRect(2, 2, 60, 60);
          }
          g.fillStyle = "#fff";
          g.font = '700 38px ui-sans-serif, system-ui, "PingFang TC"';
          g.textAlign = "center";
          g.textBaseline = "middle";
          const ch = (s.label.match(/[A-Za-z0-9\u4e00-\u9fff]/) || ["?"])[0];
          g.fillText(ch.toUpperCase(), 32, 36);
          const link = document.createElement("link");
          link.rel = "icon";
          link.href = cv.toDataURL();
          document.head.appendChild(link);
        } catch (e) {}
        const b = document.createElement("div");
        b.className = "vt-session-badge";
        b.style.setProperty("--vt-session-color", col);
        b.innerHTML =
          '<span class="dot"></span><span class="lb"></span><span class="id"></span>';
        b.querySelector(".lb").textContent = s.label;
        b.querySelector(".id").textContent = s.id || "";
        const host = document.querySelector("header") || document.body;
        host.insertBefore(b, host.firstChild);
      })();
    </script>
  </body>
</html>
